name: tests

on: [push]

jobs:
  test:

    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: "TESTAPIKEY"
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install pip and package
      run: |
        python -m pip install --upgrade pip
        pip install ".[dev]"
    - name: Run linting
      run: |
        echo "isort version:"
        isort --version
        black --check t2ebm/ tests/
        isort --check t2ebm/ tests/
        flake8 t2ebm/ tests/ --max-line-length=88 --extend-ignore=E203,E501,W503,F401,F841,F811,E722,W293,W291,F824
    - name: Run tests
      run: |
        echo "pytest-cov version:"
        python -c "import pytest_cov; print(pytest_cov.__version__)"
        echo "Coverage version:"
        python -c "import coverage; print(coverage.__version__)"
        echo "Python path:"
        python -c "import sys; print(sys.path)"
        echo "Current directory contents:"
        ls -la
        echo "t2ebm directory contents:"
        ls -la t2ebm/
        python -m pytest --cov=t2ebm --cov-report=term-missing --cov-fail-under=70
